name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual runs. Added because GitHub throttled webhook delivery during an
  # Actions incident and pull_request events stopped starting workflows at
  # all — dispatch goes through the API instead and is unaffected.
  workflow_dispatch:

# Least privilege: the docs checks only read the repo.
permissions:
  contents: read

# Cancel an in-progress run when a *PR branch* is pushed again — but never a
# push to main, or that commit keeps a permanently "cancelled" status.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    name: Documentation checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Actions are pinned to immutable commit SHAs: a mutable tag can be
      # repointed at tampered code after the fact, a commit SHA cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Check links, anchors, fences and tables
        run: python3 tools/doccheck/checkdocs.py .

      - name: Parse every Mermaid diagram
        run: |
          npm --prefix tools/doccheck install --no-save mermaid@11 jsdom@25
          node tools/doccheck/mmdcheck.mjs .

  scripts:
    name: Build-script checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The scripts must stay bash-3.2-compatible for macOS's /bin/bash.
      - name: Syntax-check all scripts
        run: bash -n scripts/*.sh

      # Mock-engine tests: they assert the stub's argument handling, never that
      # a Mac build succeeded — xcodebuild cannot run on Linux.
      - name: Run build-script tests
        run: python3 tools/tests/test_buildscripts.py

      - name: Verify unsupported-platform C contracts
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I Sources/CoreographySystem/include \
            tools/tests/test_process_bridge.c Sources/CoreographySystem/process.c \
            -o "$RUNNER_TEMP/test_process_bridge"
          "$RUNNER_TEMP/test_process_bridge"

      - name: Verify unsupported-platform thermal contracts
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I Sources/CoreographySystem/include \
            tools/tests/test_thermal_bridge.c Sources/CoreographySystem/thermal.c \
            -o "$RUNNER_TEMP/test_thermal_bridge"
          "$RUNNER_TEMP/test_thermal_bridge"

      - name: Verify unsupported-platform SMC contracts
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I Sources/CoreographySystem/include \
            tools/tests/test_smc_bridge.c Sources/CoreographySystem/smc.c \
            -o "$RUNNER_TEMP/test_smc_bridge"
          "$RUNNER_TEMP/test_smc_bridge"

      - name: Verify unsupported-platform network contracts
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I Sources/CoreographySystem/include \
            -I Sources/CoreographySystem tools/tests/test_network_bridge.c \
            Sources/CoreographySystem/network.c -o "$RUNNER_TEMP/test_network_bridge"
          "$RUNNER_TEMP/test_network_bridge"

      - name: Shellcheck
        run: |
          command -v shellcheck >/dev/null || sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh

  macos:
    name: macOS build
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned toolchain: runner-image bumps must not change the Xcode version.
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.6'

      # No Xcode test target yet: the SwiftPM suite is the test gate.
      - name: Run SwiftPM tests
        run: swift test

      - name: Verify libproc bridge contracts and CPU units
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I Sources/CoreographySystem/include \
            tools/tests/test_process_bridge.c Sources/CoreographySystem/process.c \
            -o "$RUNNER_TEMP/test_process_bridge"
          "$RUNNER_TEMP/test_process_bridge"

      - name: Verify native thermal-pressure levels
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I Sources/CoreographySystem/include \
            tools/tests/test_thermal_bridge.c Sources/CoreographySystem/thermal.c \
            -o "$RUNNER_TEMP/test_thermal_bridge"
          "$RUNNER_TEMP/test_thermal_bridge"

      - name: Verify AppleSMC bridge contracts
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I Sources/CoreographySystem/include \
            tools/tests/test_smc_bridge.c Sources/CoreographySystem/smc.c \
            -framework IOKit -o "$RUNNER_TEMP/test_smc_bridge"
          "$RUNNER_TEMP/test_smc_bridge"

      - name: Verify native interface counters and full-width mapping
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I Sources/CoreographySystem/include \
            -I Sources/CoreographySystem tools/tests/test_network_bridge.c \
            Sources/CoreographySystem/network.c -o "$RUNNER_TEMP/test_network_bridge"
          "$RUNNER_TEMP/test_network_bridge"

      # Builds dist/Coreography.app universal (both slices in app AND embedded
      # CLI are verified by assemble-app.sh before packaging) and zips it to
      # dist/Coreography-v<version>-macos-universal.zip.
      - name: Build universal app (ad-hoc signed)
        # Hosted runners do not have the developer's shared lkm-build installation.
        run: COREO_ARCH=universal ./scripts/assemble-app.sh

      # Independent slice check: if the assemble script's own verification ever
      # regressed, this still stops a wrong-arch artifact from being published.
      - name: Verify universal slices
        run: |
          for bin in dist/Coreography.app/Contents/MacOS/Coreography \
                     dist/Coreography.app/Contents/Helpers/coreo; do
            arches="$(lipo -archs "$bin")"
            echo "$bin: $arches"
            for want in arm64 x86_64; do
              case " $arches " in *" $want "*) ;; *)
                echo "::error::$bin lacks the $want slice (has: $arches)"
                exit 1 ;;
              esac
            done
          done

      - name: Smoke-test embedded CLI
        run: |
          set -euo pipefail
          CLI="dist/Coreography.app/Contents/Helpers/coreo"
          "$CLI" doctor
          "$CLI" snapshot --once --json > "$RUNNER_TEMP/snapshot.json"
          python3 tools/check_snapshot.py "$RUNNER_TEMP/snapshot.json"

      - name: Smoke-test native process counters
        run: |
          set -euo pipefail
          dist/Coreography.app/Contents/Helpers/coreo processes --once --json > "$RUNNER_TEMP/processes.json"
          python3 - "$RUNNER_TEMP/processes.json" <<'PY'
          import json, sys
          with open(sys.argv[1]) as source:
              snapshot = json.load(source)
          assert snapshot["enumeration"]["availability"] == "measured"
          assert snapshot["enumeration"]["numericValue"] >= len(snapshot["processes"])
          own = next(row for row in snapshot["processes"] if row["id"]["pid"] == snapshot["collectorPID"])
          assert own["id"]["startSeconds"] > 0
          assert 0 <= own["id"]["startMicroseconds"] < 1_000_000
          cpu = own["cpuPercentOfMachine"]
          assert cpu["availability"] == "measured" and 0 <= cpu["numericValue"] <= 100
          memory = own["memoryFootprintBytes"]
          assert memory["availability"] == "measured" and memory["numericValue"] > 0
          for field in ("diskReadBytesPerSecond", "diskWriteBytesPerSecond"):
              assert own[field]["availability"] == "measured" and own[field]["numericValue"] >= 0
          assert own["executablePath"].endswith("/Coreography.app/Contents/Helpers/coreo")
          # The responsibility SPI is optional by design; record whether it resolved.
          responsible = own.get("responsiblePID")
          assert responsible is None or (type(responsible) is int and responsible >= 0)
          resolved = sum(1 for row in snapshot["processes"] if "responsiblePID" in row)
          print(f"responsiblePID for coreo: {responsible}; resolved for {resolved} of {len(snapshot['processes'])} processes")
          PY

      - name: Smoke-test native GPU statistics
        run: |
          set -euo pipefail
          dist/Coreography.app/Contents/Helpers/coreo gpu --once --json > "$RUNNER_TEMP/gpu.json"
          python3 - "$RUNNER_TEMP/gpu.json" <<'PY'
          import json, math, sys
          with open(sys.argv[1]) as source:
              snapshot = json.load(source)
          assert snapshot["enumeration"]["availability"] == "measured"
          assert snapshot["enumeration"]["numericValue"] >= len(snapshot["devices"])
          measured = 0
          for device in snapshot["devices"]:
              busy = device["utilizationPercent"]
              if busy["availability"] == "measured":
                  assert math.isfinite(busy["numericValue"]) and 0 <= busy["numericValue"] <= 100
                  measured += 1
              else:
                  assert busy["availability"] == "unavailable" and busy["reason"]
          names = [device["name"] for device in snapshot["devices"]]
          print(json.dumps({"gpus": names, "measuredUtilization": measured, "issues": len(snapshot["issues"])}))
          if not snapshot["devices"]:
              print("No IOAccelerator is exposed; GPU accuracy is unverified on this runner.")
          PY

      - name: Smoke-test native power sources
        run: |
          set -euo pipefail
          dist/Coreography.app/Contents/Helpers/coreo power --once --json > "$RUNNER_TEMP/power.json"
          python3 - "$RUNNER_TEMP/power.json" <<'PY'
          import json, math, sys
          with open(sys.argv[1]) as source:
              power = json.load(source)
          numeric = ("measured", "estimated")
          states = numeric + ("unavailable", "unsupported", "restricted")
          for key in ("systemPowerWatts", "batteryChargePercent", "batteryPowerWatts", "adapterRatingWatts"):
              reading = power[key]
              assert reading["availability"] in states, key
              if reading["availability"] in numeric:
                  assert math.isfinite(reading["numericValue"]), key
              else:
                  assert "numericValue" not in reading and reading.get("reason"), key
          charge = power["batteryChargePercent"]
          if charge["availability"] == "measured":
              assert 0 <= charge["numericValue"] <= 100
          system = power["systemPowerWatts"]
          assert system["availability"] != "estimated" or system["numericValue"] > 0
          print(json.dumps({key: power[key]["availability"] for key in ("systemPowerWatts", "batteryChargePercent", "adapterRatingWatts")}))
          PY

      - name: Smoke-test native SMC sensors
        run: |
          set -euo pipefail
          dist/Coreography.app/Contents/Helpers/coreo sensors --once --json > "$RUNNER_TEMP/sensors.json"
          python3 - "$RUNNER_TEMP/sensors.json" <<'PY'
          import json, math, sys
          with open(sys.argv[1]) as source:
              sensors = json.load(source)
          states = ("measured", "estimated", "unavailable", "unsupported", "restricted")
          assert sensors["source"]["availability"] in states
          power = sensors["systemPowerWatts"]
          if power["availability"] == "estimated":
              assert math.isfinite(power["numericValue"]) and power["numericValue"] > 0
          else:
              assert "numericValue" not in power and power.get("reason")
          hottest = sensors.get("hottest")
          if hottest:
              assert 10 <= hottest["celsius"]["numericValue"] <= 130
          print(json.dumps({"source": sensors["source"]["availability"], "power": power["availability"],
                            "hottest": hottest and hottest["key"], "fans": len(sensors["fans"]),
                            "plausible": sensors["plausibleTemperatureCount"]}))
          PY

      - name: Smoke-test the diagnostic contract
        run: |
          set -euo pipefail
          dist/Coreography.app/Contents/Helpers/coreo diagnose --json --seconds 3 > "$RUNNER_TEMP/diagnose.json"
          python3 - "$RUNNER_TEMP/diagnose.json" <<'PY'
          import json, sys
          with open(sys.argv[1]) as source:
              report = json.load(source)
          summary = report["summary"]
          assert summary["cpuPercentOfMachine"]["unit"] == "%"
          assert summary["cpuPercentOfMachine"]["reading"]["availability"] == "measured"
          assert summary["windowStart"] <= summary["windowEnd"]
          for signal in summary["signals"]:
              assert signal["evidence"] and signal["detail"]
          for page in (report["topCPUApps"], report["topDiskApps"]):
              assert len(page["rows"]) <= 10 and page["coverageNote"]
          assert any(source["metric"] == "cpu" for source in report["dataSources"])
          assert "/Users/" not in json.dumps(report), "diagnostics must not expose paths"
          print(json.dumps({"signals": [s["kind"] for s in summary["signals"]],
                            "topCPU": [r["app"] for r in report["topCPUApps"]["rows"][:3]]}))
          PY

      - name: Smoke-test the MCP stdio server
        run: |
          set -euo pipefail
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"get_data_sources","arguments":{}}}' \
            | dist/Coreography.app/Contents/Helpers/coreo mcp --stdio > "$RUNNER_TEMP/mcp.jsonl"
          python3 - "$RUNNER_TEMP/mcp.jsonl" <<'PY'
          import json, sys
          with open(sys.argv[1]) as source:
              replies = [json.loads(line) for line in source if line.strip()]
          assert [reply["id"] for reply in replies] == [1, 2, 3], "one reply per request, none for the notification"
          assert replies[0]["result"]["protocolVersion"] == "2025-06-18"
          assert len(replies[1]["result"]["tools"]) == 6
          call = replies[2]["result"]
          assert call["isError"] is False and json.loads(call["content"][0]["text"])
          print(json.dumps({"tools": [tool["name"] for tool in replies[1]["result"]["tools"]]}))
          PY

      - name: Smoke-test the on-disk history store
        run: |
          set -euo pipefail
          dist/Coreography.app/Contents/Helpers/coreo history --json cpu --minutes 5 > "$RUNNER_TEMP/history.json"
          python3 - "$RUNNER_TEMP/history.json" <<'PY'
          import json, os, stat, sys
          with open(sys.argv[1]) as source:
              report = json.load(source)
          assert report["metric"] == "cpu" and report["storedSamples"] == len(report["samples"])
          directory = os.path.expanduser("~/Library/Application Support/Coreography/History")
          assert stat.S_IMODE(os.stat(directory).st_mode) == 0o700, "history directory must be private"
          database = os.path.join(directory, "history.sqlite")
          assert stat.S_IMODE(os.stat(database).st_mode) == 0o600, "history file must be private"
          print(json.dumps({"storedSamples": report["storedSamples"]}))
          PY
          dist/Coreography.app/Contents/Helpers/coreo apps --json --minutes 5 > "$RUNNER_TEMP/apps.json"
          python3 - "$RUNNER_TEMP/apps.json" <<'PY'
          import json, sys
          with open(sys.argv[1]) as source:
              report = json.load(source)
          assert report["windowStart"] <= report["windowEnd"] and report["intervals"] >= 0
          assert len(report["apps"]) <= 50 and all(app["cpuSeconds"] >= 0 for app in report["apps"])
          assert "/Users/" not in json.dumps(report), "stored app totals must not expose paths"
          print(json.dumps({"intervals": report["intervals"], "apps": len(report["apps"])}))
          PY

      - name: Smoke-test per-process connections
        run: |
          set -euo pipefail
          # A listener whose port only this step knows; the bridge must report it.
          python3 -c 'import socket, sys, time
          s = socket.socket(); s.bind(("127.0.0.1", 0)); s.listen()
          print(s.getsockname()[1], flush=True); time.sleep(120)' > "$RUNNER_TEMP/port.txt" &
          listener=$!
          for _ in $(seq 50); do [ -s "$RUNNER_TEMP/port.txt" ] && break; sleep 0.1; done
          dist/Coreography.app/Contents/Helpers/coreo connections --once --json > "$RUNNER_TEMP/connections.json"
          kill "$listener"
          python3 - "$RUNNER_TEMP/connections.json" "$(cat "$RUNNER_TEMP/port.txt")" <<'PY'
          import json, sys
          with open(sys.argv[1]) as source:
              snapshot = json.load(source)
          port = int(sys.argv[2])
          assert snapshot.get("unavailableReason") is None
          listening = [c for c in snapshot["connections"]
                       if c["transport"] == "tcp" and c["local"]["port"] == port and c.get("state") == 1]
          assert listening and listening[0]["local"]["address"] == "127.0.0.1", f"listener on {port} not reported"
          print(json.dumps({"sockets": len(snapshot["connections"]), "restricted": snapshot["restrictedProcesses"],
                            "listener": listening[0]["processName"]}))
          PY

      - name: Smoke-test the sleep history import
        run: |
          set -euo pipefail
          dist/Coreography.app/Contents/Helpers/coreo sleep --json --hours 168 > "$RUNNER_TEMP/sleep.json"
          pmset -g log > "$RUNNER_TEMP/pmset.log"
          python3 - "$RUNNER_TEMP/sleep.json" "$RUNNER_TEMP/pmset.log" <<'PY'
          import json, re, sys
          from datetime import datetime
          with open(sys.argv[1]) as source:
              report = json.load(source)
          assert report["source"] == "pmset -g log" and report.get("coveredFrom"), "the import read dated records"
          # Count real Sleep, Wake and DarkWake records independently of the parser.
          record = re.compile(r"^(\d{4}-\d\d-\d\d \d\d:\d\d:\d\d [+-]\d{4}) (Sleep|Wake|DarkWake)(\t| {2,})")
          parse = lambda text: datetime.fromisoformat(text.replace("Z", "+00:00"))
          start = max(parse(report["windowStart"]), parse(report["coveredFrom"]))
          # Records written after the import's own read are not its to count.
          end = min(parse(report["windowEnd"]), parse(report["coveredTo"]))
          expected = 0
          with open(sys.argv[2], errors="replace") as log:
              for line in log:
                  match = record.match(line)
                  if match and start <= datetime.strptime(match.group(1), "%Y-%m-%d %H:%M:%S %z") <= end:
                      expected += 1
          parsed = len(report["events"]) + report["omittedEvents"]
          assert parsed == expected, f"parsed {parsed} records, the log holds {expected}"
          print(json.dumps({"events": parsed, "periods": len(report["periods"]),
                            "partial": report.get("partialCoverage"), "coveredFrom": report["coveredFrom"]}))
          PY

      - name: Smoke-test native network counters
        run: |
          set -euo pipefail
          dist/Coreography.app/Contents/Helpers/coreo network --once --json > "$RUNNER_TEMP/network.json"
          python3 - "$RUNNER_TEMP/network.json" <<'PY'
          import json, math, sys
          with open(sys.argv[1]) as source:
              snapshot = json.load(source)
          assert snapshot["enumeration"]["availability"] == "measured"
          assert snapshot["interfaces"]
          loopback = next(row for row in snapshot["interfaces"] if row["id"]["name"] == "lo0")
          assert loopback["id"]["index"] > 0
          for field in ("receivedBytesPerSecond", "sentBytesPerSecond"):
              reading = loopback[field]
              assert reading["availability"] == "measured"
              assert math.isfinite(reading["numericValue"]) and reading["numericValue"] >= 0
          if snapshot.get("primaryInterface") is None:
              assert snapshot["primaryIssue"]["availability"] in ("unavailable", "restricted")
          PY

      - name: Smoke-test native storage inventory and available rates
        run: |
          set -euo pipefail
          dist/Coreography.app/Contents/Helpers/coreo disks --once --json > "$RUNNER_TEMP/disks.json"
          python3 - "$RUNNER_TEMP/disks.json" <<'PY'
          import json, math, sys
          with open(sys.argv[1]) as source:
              snapshot = json.load(source)
          assert snapshot["enumeration"]["availability"] == "measured"
          identities = [row["id"]["registryEntryID"] for row in snapshot["devices"]]
          assert all(identity > 0 for identity in identities)
          assert len(identities) == len(set(identities))
          measured = 0
          for row in snapshot["devices"]:
              assert row["name"]
              for field in ("readBytesPerSecond", "writtenBytesPerSecond"):
                  reading = row[field]
                  if reading["availability"] == "measured":
                      assert math.isfinite(reading["numericValue"]) and reading["numericValue"] >= 0
                      measured += 1
                  else:
                      assert reading["availability"] in ("collecting", "gap", "restricted", "unavailable")
                      assert reading.get("numericValue") is None
          print(json.dumps({"storageDrivers": len(identities), "measuredRateFields": measured,
                            "inventoryIssues": len(snapshot["issues"])}))
          if not identities:
              print("No matching storage driver is exposed; device-rate accuracy is unverified on this runner.")
          PY

      - name: Package tested app
        run: |
          set -euo pipefail
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/Coreography.app/Contents/Info.plist)
          archive="dist/Coreography-v${version}-macos-universal.zip"
          ditto -c -k --keepParent dist/Coreography.app "$archive"
          unzip -t "$archive"

      - name: Resolve package name
        id: pkg
        run: |
          zip="$(ls dist/Coreography-v*-macos-universal.zip)"
          echo "name=$(basename "$zip" .zip)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: dist/Coreography-v*-macos-universal.zip
          if-no-files-found: error
